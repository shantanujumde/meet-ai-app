# Release automation (TUR-34). RELEASING.md describes the flow; the manual
# steps there are the fallback when this workflow cannot run.
#
# 1. Every push to main runs `check`. When `check` passes, this workflow runs.
# 2. release-please reads the Conventional Commit titles merged since the last
#    tag and opens or updates one release PR. That PR bumps the version in
#    Cargo.toml and package.json (src-tauri/tauri.conf.json reads it from
#    package.json), and adds a CHANGELOG.md entry above the existing text.
#    It also bumps the workspace crates in Cargo.lock: every one of them
#    inherits the workspace version. Config: release-please-config.json and
#    .release-please-manifest.json.
# 3. Merging the release PR makes release-please tag vX.Y.Z and create the
#    GitHub release. Only then do `build`, `build-other` and `publish` run:
#    build and sign the macOS app with the one persistent identity, re-check
#    the signature, zip it; build the Windows NSIS installer, the .deb and the
#    AppImage (unsigned, marked preview); checksum each file and attach them
#    all to the release. Every other merge publishes
#    nothing.
#
# Security:
# - workflow_run only fires for the copy of this file on main, and the
#   `release-please` guard below only lets through a successful `check` run
#   for a push to main of this repo. Pull requests, from forks or not, never
#   reach a job that holds a secret or a write token.
# - The signing secrets live only in `build`, which has a read-only token.
#   The jobs with a write token never see the signing key.
# - The signing key goes into a temp keychain with a per-run random
#   password, and that keychain is deleted at the end, pass or fail.
# - Secrets and workflow_run fields reach scripts through `env`, never by
#   `${{ }}` interpolation inside `run:`.

name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

# One release run at a time, and never cancel one half way: a cancelled
# publish could leave a release with only some of its files. A newer run
# waits for the one in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: >-
      github.repository == 'shantanujumde/meet-ai-app' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      # RELEASE_PLEASE_TOKEN is optional (a fine-grained PAT with contents and
      # pull-requests write on this repo). With it, `check` runs on the
      # release PR like on any other PR. Without it, GitHub does not start
      # workflows for what GITHUB_TOKEN pushes, so the release PR shows no
      # check; `check` still runs on the merge commit and gates `build`.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    # A cold cache builds whisper.cpp and the whole workspace in release mode.
    timeout-minutes: 90
    permissions:
      contents: read
      # Read `check` results for the release commit (first step).
      actions: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      APP: target/release/bundle/macos/meet-ai.app
      # The one persistent identity (docs/findings.md §10.6, §11). A
      # different leaf resets every user's microphone and system-audio grant,
      # so this run fails rather than ship one.
      EXPECTED_LEAF: eafb73d29b2f35ca25c2f9fd193869fd880a7e0d
    steps:
      # release-please tags the release PR's merge commit, which can be older
      # than the commit whose `check` started this run. Make sure `check`
      # passed on the commit that is being shipped.
      - name: check passed on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed="$(gh api "repos/$GH_REPO/actions/workflows/check.yml/runs?head_sha=$RELEASE_SHA&event=push&status=success" --jq '.total_count')"
          if [[ "$passed" == "0" ]]; then
            echo "::error::check has not passed on $RELEASE_SHA. Re-run check on that commit, then re-run this workflow's failed jobs."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      # tauri.conf.json takes its version from package.json
      # ("version": "../package.json"), so it has no number of its own.
      - name: Version files hold the release version
        run: |
          python3 - <<'PY'
          import json, os, sys, tomllib
          want = os.environ["VERSION"]
          found = {
              "Cargo.toml": tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"],
              "package.json": json.load(open("package.json"))["version"],
          }
          tauri = json.load(open("src-tauri/tauri.conf.json"))["version"]
          if tauri != "../package.json":
              found["src-tauri/tauri.conf.json"] = tauri
          bad = {k: v for k, v in found.items() if v != want}
          for k, v in bad.items():
              print(f"::error file={k}::version is {v}, release is {want}")
          sys.exit(1 if bad else 0)
          PY

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          # Release profile: its own cache, apart from check.yml's debug one.
          shared-key: release
          # Save the compiled dependencies even when a later step fails (a
          # signing or upload problem, say). The fix for those is "re-run
          # failed jobs", and that re-run then skips the cold release build of
          # whisper.cpp and the workspace's dependencies. Releases only run
          # from main, so there is no PR cache to protect here.
          cache-on-failure: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cmake if missing
        run: command -v cmake >/dev/null || brew install cmake

      # The .p12 is the identity from scripts/signing/make-identity.sh,
      # exported once (RELEASING.md "One-time setup"). The keychain password
      # is random per run and masked; the .p12 file is deleted right after
      # the import.
      - name: Import signing identity into a temp keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "::error::MACOS_SIGNING_P12_BASE64 and MACOS_SIGNING_P12_PASSWORD must both be set (RELEASING.md, One-time setup)."
            exit 1
          fi
          KC="$RUNNER_TEMP/meet-ai-signing.keychain-db"
          P12="$RUNNER_TEMP/meet-ai-signing.p12"
          KC_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$KC_PASS"

          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$P12"
          # Lets codesign use the key without a GUI "allow" prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          # Prepend to the search list; keep what the runner already had.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line#\"}"; line="${line%\"}"
            [[ -n "$line" ]] && existing+=("$line")
          done < <(security list-keychains -d user)
          # `${a[@]+...}`: an empty array under `set -u` aborts bash 3.2.
          security list-keychains -d user -s "$KC" ${existing[@]+"${existing[@]}"}

          # Same identity or stop, before spending 20 minutes on a build.
          leaf="$(security find-certificate -a -c "meet-ai Local Signing" -p "$KC" \
            | openssl x509 -outform der | shasum -a 1 | awk '{print $1}')"
          if [[ "$leaf" != "$EXPECTED_LEAF" ]]; then
            echo "::error::the .p12 holds leaf $leaf, expected $EXPECTED_LEAF. Export the existing identity; never mint a new one (RELEASING.md)."
            exit 1
          fi
          echo "leaf SHA-1 matches: $leaf"

          # Best effort: mark the cert trusted for code signing in the user
          # domain, as make-identity.sh does on a laptop. codesign signs with
          # an untrusted self-signed identity too, and the checks after the
          # build are what decide, so a refusal here is only a warning. perl
          # `alarm` bounds it in case the runner ever waits for a dialog.
          cert="$RUNNER_TEMP/meet-ai-signing-cert.pem"
          security find-certificate -c "meet-ai Local Signing" -p "$KC" > "$cert"
          if perl -e 'alarm 60; exec @ARGV' security add-trusted-cert -r trustRoot -p codeSign -k "$KC" "$cert"; then
            echo "cert trusted for code signing (user domain)"
          else
            echo "::warning::could not mark the cert trusted; continuing, the signature checks below decide."
          fi
          rm -f "$cert"

          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      # `just sign` takes SIGN_KEYCHAIN and SIGN_IDENTITY from the
      # environment. Signing by the leaf hash, not the name, means no other
      # certificate can be picked.
      - name: just bundle-signed
        env:
          SIGN_IDENTITY: ${{ env.EXPECTED_LEAF }}
        run: just bundle-signed

      # RELEASING.md "Build and sign the app": verify, same leaf, same
      # version.
      - name: Re-check the signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          req="$(codesign -d -r- "$APP" 2>&1)"
          echo "$req"
          leaf="$(grep -o 'leaf = H"[0-9a-f]*"' <<<"$req" | head -1 | sed -e 's/^leaf = H"//' -e 's/"$//')"
          if [[ "$leaf" != "$EXPECTED_LEAF" ]]; then
            echo "::error::app is signed with leaf '${leaf:-none}', expected $EXPECTED_LEAF."
            exit 1
          fi
          if ! grep -q 'identifier "pro.saleschat.meetai"' <<<"$req"; then
            echo "::error::designated requirement does not name pro.saleschat.meetai."
            exit 1
          fi
          built="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          if [[ "$built" != "$VERSION" ]]; then
            echo "::error::app reports version $built, release is $VERSION."
            exit 1
          fi
          echo "signature OK: leaf $leaf, version $built"

      # `ditto`, not `zip`: it keeps the signature intact on unzip. The
      # unzipped copy is verified again so a broken archive never ships.
      - name: Zip and checksum
        run: |
          set -euo pipefail
          Z="meet-ai-${VERSION}-macos-arm64.zip"
          OUT="$RUNNER_TEMP/release-out"
          mkdir -p "$OUT"
          (cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent meet-ai.app "$OUT/$Z")
          (cd "$OUT" && shasum -a 256 "$Z" > "$Z.sha256" && shasum -a 256 -c "$Z.sha256")
          UNZIP="$RUNNER_TEMP/unzip-check"
          mkdir -p "$UNZIP"
          ditto -x -k "$OUT/$Z" "$UNZIP"
          codesign --verify --deep --strict "$UNZIP/meet-ai.app"
          rm -rf "$UNZIP"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # Updater archive (TUR-66). Made here from the re-signed app, not by
      # Tauri's `createUpdaterArtifacts`, which would tar the .app before
      # `just sign` re-signs it. COPYFILE_DISABLE keeps AppleDouble `._`
      # files out: they would land inside the installed bundle and break its
      # seal. The unpacked copy is verified like the zip.
      - name: Updater archive and signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for s in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!s}" ]]; then
              echo "::error::secret $s is not set; the updater files cannot be signed (RELEASING.md, One-time setup)."
              exit 1
            fi
          done
          T="meet-ai-${VERSION}-macos-arm64.app.tar.gz"
          (cd "$(dirname "$APP")" && COPYFILE_DISABLE=1 tar -czf "$OUT/$T" meet-ai.app)
          UNTAR="$RUNNER_TEMP/untar-check"
          mkdir -p "$UNTAR"
          tar -xzf "$OUT/$T" -C "$UNTAR"
          codesign --verify --deep --strict "$UNTAR/meet-ai.app"
          rm -rf "$UNTAR"
          pnpm tauri signer sign "$OUT/$T"
          test -s "$OUT/$T.sig"
          (cd "$OUT" && shasum -a 256 "$T" > "$T.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 7

      - name: Delete the temp keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/meet-ai-signing.keychain-db"
          if [[ -f "$KC" ]]; then
            security delete-keychain "$KC"
            echo "deleted $KC"
          fi
          rm -f "$RUNNER_TEMP/meet-ai-signing.p12" "$RUNNER_TEMP/meet-ai-signing-cert.pem"

  # Windows and Linux (TUR-39). The macOS `build` job above is unchanged.
  # Same flags as check.yml's `rust-native` job: Windows long paths, libclang
  # for bindgen, the Ubuntu apt list from TUR-36, GGML_NATIVE=OFF. Unsigned:
  # Windows signing is its own ticket. Each leg uploads its file and .sha256
  # as `release-files-<name>`; `publish` downloads every `release-files*`.
  # deb builds on 24.04: 22.04's libpipewire-0.3-dev (0.3.48) is too old
  # for the libspa 0.10.1 that cpal's pipewire feature pins (TUR-38), so
  # the .deb needs Ubuntu 24.04 or later, like the AppImage.
  # Matrix shape adapted from github.com/cjpais/Handy/.github/workflows/build.yml @ ffbc9504cbf004ce4819d2ca872fcea92be0fddf (MIT)
  build-other:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: build (${{ matrix.name }})
    strategy:
      # One leg failing must not cancel the others: re-run only that leg.
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundle: nsis
            ext: exe
            asset: windows-x64-setup.exe
          - name: linux-deb
            os: ubuntu-24.04
            bundle: deb
            ext: deb
            asset: linux-amd64.deb
          - name: linux-appimage
            os: ubuntu-24.04
            bundle: appimage
            ext: AppImage
            asset: linux-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      # Same guard as the macOS job: `check` passed on the shipped commit.
      - name: check passed on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed="$(gh api "repos/$GH_REPO/actions/workflows/check.yml/runs?head_sha=$RELEASE_SHA&event=push&status=success" --jq '.total_count')"
          if [[ "$passed" == "0" ]]; then
            echo "::error::check has not passed on $RELEASE_SHA. Re-run check on that commit, then re-run this workflow's failed jobs."
            exit 1
          fi

      # Adapted from github.com/cjpais/Handy/.github/workflows/build.yml @ ffbc9504cbf004ce4819d2ca872fcea92be0fddf (MIT)
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      # tauri.conf.json takes its version from package.json
      # ("version": "../package.json"), so it has no number of its own.
      - name: Version files hold the release version
        run: |
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          "$py" - <<'PY'
          import json, os, re, sys
          want = os.environ["VERSION"]
          cargo = open("Cargo.toml", encoding="utf-8").read()
          m = re.search(r'^\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"', cargo, re.M | re.S)
          found = {
              "Cargo.toml": m.group(1) if m else "missing",
              "package.json": json.load(open("package.json", encoding="utf-8"))["version"],
          }
          tauri = json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"]
          if tauri != "../package.json":
              found["src-tauri/tauri.conf.json"] = tauri
          bad = {k: v for k, v in found.items() if v != want}
          for k, v in bad.items():
              print(f"::error file={k}::version is {v}, release is {want}")
          sys.exit(1 if bad else 0)
          PY

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # The apt list from check.yml's rust-native job (TUR-36), plus the
      # whisper.cpp build tools. No webkit pin: Handy and zmk-studio pin
      # libwebkit2gtk-4.1-dev=2.44.0-2 on 24.04 for the AppImage (reason
      # unverified); add it here only if the AppImage build fails without it.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev patchelf \
            libpipewire-0.3-dev \
            cmake clang libclang-dev

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> "$GITHUB_ENV"

      # ggml-vulkan (TUR-61), as in check.yml's rust-native job: the SDK to
      # build it, and the Khronos loader vulkan-1.dll in src-tauri/vulkan/,
      # which tauri.windows.conf.json bundles beside meet-ai.exe.
      # Adapted from github.com/cjpais/Handy/.github/workflows/build.yml @ 73ab851c2b6242283759a4c101b60f0ece132f08 (MIT)
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # The x64 loader from LunarG's Vulkan Runtime components, pinned by
      # SHA-256, into src-tauri/vulkan/ for tauri.windows.conf.json to bundle
      # beside meet-ai.exe (as in check.yml).
      - name: Vulkan loader for the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_RT_URL: https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanRT-1.4.309.0-Components.zip
          VULKAN_RT_SHA256: 7d969f4d7b44e387667d3148f61559497c22d50cbe3d50adc9e5409afbce2df1
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'vulkan-rt.zip'
          Invoke-WebRequest -Uri $env:VULKAN_RT_URL -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 5
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VULKAN_RT_SHA256) {
            Write-Error "Vulkan Runtime zip has SHA-256 $hash, expected $env:VULKAN_RT_SHA256"
            exit 1
          }
          $out = Join-Path $env:RUNNER_TEMP 'vulkan-rt'
          Expand-Archive $zip -DestinationPath $out -Force
          New-Item -ItemType Directory -Force src-tauri/vulkan | Out-Null
          Copy-Item (Join-Path $out 'VulkanRT-1.4.309.0-Components/x64/vulkan-1.dll') src-tauri/vulkan/
          Get-Item src-tauri/vulkan/vulkan-1.dll | Format-List FullName, Length

      # ggml-vulkan's nested cmake build passes MAX_PATH under the workspace's
      # target/ (MSBuild's file tracker ignores long paths), so cargo builds
      # into D:\t, as in check.yml. A junction keeps `target/` the path the
      # steps below read (TUR-61).
      - name: Short target folder (Windows)
        if: runner.os == 'Windows'
        run: |
          dir="$(cygpath -u "$GITHUB_WORKSPACE")/../../../t"
          mkdir -p "$dir"
          dir="$(realpath "$dir")"
          echo "Target folder: $(cygpath -m "$dir")"
          echo "CARGO_TARGET_DIR=$(cygpath -m "$dir")" >> "$GITHUB_ENV"
          MSYS_NO_PATHCONV=1 cmd /c mklink /J target "$(cygpath -w "$dir")"

      # LunarG's list for this runner's Ubuntu release (jammy for the deb,
      # noble for the AppImage).
      # Adapted from github.com/cjpais/Handy/.github/workflows/build.yml @ 73ab851c2b6242283759a4c101b60f0ece132f08 (MIT)
      - name: Install the Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          . /etc/os-release
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-1.3.290-$VERSION_CODENAME.list" "https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-$VERSION_CODENAME.list"
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y vulkan-sdk

      # Forces GGML_NATIVE OFF inside whisper.cpp's cmake project, as in
      # check.yml: no -march=native, so no illegal-instruction crash on a
      # user's older CPU.
      - name: Build whisper.cpp portably (GGML_NATIVE=OFF)
        run: |
          root="$(pwd -W 2>/dev/null || pwd)"
          echo "CMAKE_PROJECT_INCLUDE=$root/crates/stt/cmake/force-portable-ggml.cmake" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          workspaces: . -> ${{ runner.os == 'Windows' && '../../../t' || 'target' }}
          cache-on-failure: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Tauri's mirrored linuxdeploy predates LINUXDEPLOY_EXCLUDED_LIBRARIES
      # (linuxdeploy 98f393c, 2025-08), so seed Tauri's tool cache with a
      # pinned upstream release that reads it.
      - name: Pin linuxdeploy (AppImage)
        if: matrix.bundle == 'appimage'
        run: |
          mkdir -p ~/.cache/tauri
          f=~/.cache/tauri/linuxdeploy-x86_64.AppImage
          curl -fsSL --retry 5 -o "$f" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $f" | sha256sum -c -
          chmod +x "$f"

      # The Tauri CLI downloads NSIS / linuxdeploy tools from GitHub, so a
      # failed attempt is retried; a retry reuses the compiled crates.
      # AppImage: never bundle libpipewire/libspa (TUR-38). Nothing links
      # them yet; when Linux recording lands they must come from the user's
      # system, because a bundled copy can mismatch the running PipeWire
      # daemon. linuxdeploy reads LINUXDEPLOY_EXCLUDED_LIBRARIES (src/core/
      # appdir.cpp @ 07333c6) and skips these; cpal links libpipewire.
      - name: pnpm tauri build
        env:
          BUNDLE: ${{ matrix.bundle }}
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libpipewire-0.3.so*;libspa*"
        run: |
          args=(--bundles "$BUNDLE")
          if [ "$RUNNER_OS" = Linux ]; then args+=(--no-sign); fi
          for attempt in 1 2 3; do
            if pnpm tauri build "${args[@]}"; then exit 0; fi
            echo "::warning::pnpm tauri build failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: whisper.cpp was built portably
        run: |
          shopt -s nullglob
          caches=(target/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt)
          if [ "${#caches[@]}" -eq 0 ]; then
            echo "::error::no whisper.cpp CMakeCache.txt under target/release/build"
            exit 1
          fi
          for cache in "${caches[@]}"; do
            grep -q '^GGML_NATIVE:BOOL=OFF$' "$cache" || {
              echo "::error file=$cache::GGML_NATIVE is not OFF"
              exit 1
            }
          done

      - name: AppImage carries no libpipewire/libspa
        if: matrix.bundle == 'appimage'
        run: |
          shopt -s nullglob
          dirs=(target/release/bundle/appimage/*.AppDir)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::warning::no AppDir left to inspect"
            exit 0
          fi
          if find "${dirs[@]}" -name 'libpipewire*' -o -name 'libspa*' | grep .; then
            echo "::error::the AppImage bundles libpipewire/libspa (TUR-38)"
            exit 1
          fi

      # One file per leg, renamed to the release's naming scheme, plus a
      # sha256sum line that `shasum -a 256 -c` also reads.
      - name: Rename and checksum
        env:
          BUNDLE: ${{ matrix.bundle }}
          EXT: ${{ matrix.ext }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(target/release/bundle/"$BUNDLE"/*."$EXT")
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected one .$EXT in target/release/bundle/$BUNDLE, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          OUT="$RUNNER_TEMP/release-out"
          mkdir -p "$OUT"
          F="meet-ai-${VERSION}-${ASSET}"
          cp "${files[0]}" "$OUT/$F"
          (cd "$OUT" && sha256sum "$F" > "$F.sha256" && sha256sum -c "$F.sha256")
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # Updater signature (TUR-66). tauri-plugin-updater 2.x installs the
      # NSIS installer and replaces the AppImage as they are, so those files
      # get a `.sig`. The .deb is not an update path yet: no signature.
      - name: Updater signature
        if: matrix.bundle == 'nsis' || matrix.bundle == 'appimage'
        env:
          ASSET: ${{ matrix.asset }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for s in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!s}" ]]; then
              echo "::error::secret $s is not set; the updater files cannot be signed (RELEASING.md, One-time setup)."
              exit 1
            fi
          done
          F="meet-ai-${VERSION}-${ASSET}"
          pnpm tauri signer sign "$OUT/$F"
          test -s "$OUT/$F.sig"

      - uses: actions/upload-artifact@v7
        with:
          name: release-files-${{ matrix.name }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release-please, build, build-other]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # `release-files` (macOS) and `release-files-<name>` (build-other),
      # merged into one folder.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-files*
          merge-multiple: true
          path: release-out

      - name: Check the files
        working-directory: release-out
        run: |
          ls -l
          for f in \
            "meet-ai-${VERSION}-macos-arm64.zip" \
            "meet-ai-${VERSION}-macos-arm64.app.tar.gz" \
            "meet-ai-${VERSION}-windows-x64-setup.exe" \
            "meet-ai-${VERSION}-linux-amd64.deb" \
            "meet-ai-${VERSION}-linux-x86_64.AppImage"; do
            shasum -a 256 -c "$f.sha256"
          done

      # Only for scripts/release/updater-json.py; nothing from it is built.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          path: src

      # The updater manifest (TUR-66), uploaded with the other files. The app
      # reads it from releases/latest/download/latest.json. Fails, naming the
      # file, if an updater artifact or its .sig is missing.
      - name: latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 src/scripts/release/test_updater_json.py
          python3 src/scripts/release/updater-json.py \
            --version "$VERSION" --tag "$TAG" --repo "$REPO" \
            --dir release-out --out release-out/latest.json
          cat release-out/latest.json

      - name: Attach the files
        working-directory: release-out
        run: |
          gh release upload "$TAG" ./* --clobber

      # RELEASING.md "Publish the GitHub release": the Install section, then
      # the changelog notes release-please wrote. Skipped if a re-run already
      # added it.
      - name: Release title and install notes
        run: |
          set -euo pipefail
          Z="meet-ai-${VERSION}-macos-arm64.zip"
          W="meet-ai-${VERSION}-windows-x64-setup.exe"
          D="meet-ai-${VERSION}-linux-amd64.deb"
          A="meet-ai-${VERSION}-linux-x86_64.AppImage"
          body="$(gh release view "$TAG" --json body --jq '.body')"
          if grep -q '^## Install$' <<<"$body"; then
            notes="$body"
          else
            notes="$(cat <<EOF
          ## Install

          ### macOS

          Download \`$Z\` (Apple silicon, macOS 26+), unzip, and move \`meet-ai.app\` to \`/Applications\`.

          The app is signed with a self-signed local identity and is not notarized, so Gatekeeper blocks the first launch. Clear the quarantine flag once:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/meet-ai.app
          \`\`\`

          ### Windows (preview: can't record yet)

          Download \`$W\` (64-bit Windows) and run it. The installer is not signed yet, so SmartScreen warns on first run: choose **More info → Run anyway**.

          ### Linux (preview: can't record yet)

          Debian or Ubuntu (24.04 or later): download \`$D\` and install it with \`sudo apt install ./$D\`.

          Any other x86_64 distribution: download \`$A\`, then \`chmod +x $A\` and run it.

          ### Checksums

          Each file has a \`.sha256\` next to it. Check a download with \`shasum -a 256 -c <file>.sha256\` (macOS) or \`sha256sum -c <file>.sha256\` (Linux, Git Bash on Windows).

          EOF
          )"
            notes="$notes"$'\n\n'"$body"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --title "meet-ai $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json assets --jq '.assets[].name'
