# The same gate as `just check` on a laptop, plus the generated-bindings check,
# a production frontend build and the repo rules.
#
# Split into jobs that run at the same time (TUR-40). Only the work that needs
# macOS runs on macOS; everything else runs on ubuntu-latest, which is faster
# to start and far cheaper per minute:
#
#   rust           macos-26  just sidecar, clippy, cargo test, bindings, quality rules
#   rust-portable  ubuntu    cargo fmt, just check-windows (the SPEC §8.2 seam)
#   js             ubuntu    biome, typecheck, vitest, pnpm build
#   rust-native    windows   just check-windows (native workspace build, test,
#                  + ubuntu  clippy), pnpm tauri build, bundle uploaded (TUR-36)
#   check-result   ubuntu    the one status named `check` (see that job)
#
# Every command `just check` runs appears below as its own `run:` line, and the
# `rust-portable` job fails if one goes missing (step "Every just check
# command runs here").
#
# Runner for `rust`: macos-26, not macos-15. `just sidecar` compiles
# sidecar/meet-stt with swiftc against Apple's SpeechAnalyzer and
# SpeechTranscriber. Those APIs only exist in the macOS 26 SDK (SPEC L2 and A8
# set macOS 26 as the floor), and the macos-15 image ships an older SDK. The
# workspace itself links Apple frameworks, and some tests are macOS-only.
#
# What the tests need, and why nothing extra is set here:
# - No model downloads. The whisper accuracy tests sit behind the
#   `whisper-model-tests` cargo feature (`just check-whisper`), which
#   `just check` does not turn on. The live_transcript_e2e tests are #[ignore]d.
# - No microphone or TCC grant. Every test that needs real audio hardware or a
#   TCC decision (crates/audio/tests/mic_closed_loop.rs, permission_check.rs,
#   system_closed_loop.rs) is #[ignore]d, so `cargo test` skips it.
# - Apple speech tests in crates/stt/tests/ skip themselves, with a SKIPPED line
#   in the log, when the sidecar is missing or Apple's en-US model is not
#   installed on the runner.
# - The stt tests generate their fixture WAVs on first use with macOS `say` and
#   ffmpeg. `say` ships with macOS; ffmpeg is installed below if the image does
#   not have it.
#
# Caches: only runs on main save them (`save-if` below). A pull request
# restores main's caches and never writes its own, so PRs cannot evict the
# entries main relies on (the repo has 10 GB of cache; one Rust cache is
# over 1 GB).

name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # Only PRs cancel: a new push to a PR makes the old run pointless, but every
  # commit on main should get its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything that needs macOS: the Swift sidecar (macOS 26 SDK), and the
  # workspace build, which links Apple frameworks and runs macOS-only tests.
  rust:
    name: rust (macos-26)
    runs-on: macos-26
    # A cold cache builds whisper.cpp and the whole workspace from scratch.
    timeout-minutes: 90
    env:
      # Line numbers only, no full debug info. Panics and backtraces still
      # name the file and line; compiling and linking the test binaries is
      # faster and the cached target/ is smaller. CI only: a laptop
      # `just check` keeps the default profile.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the quality rules can diff against the base branch.
          fetch-depth: 0

      # rust-toolchain.toml pins the Rust version, rustfmt and clippy, and the
      # aarch64-apple-darwin target. `rustup toolchain install` with no argument
      # installs exactly that.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # Dependencies only (whisper.cpp's cmake build included, inside
      # target/debug/build); rust-cache never caches workspace crates.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # cmake builds whisper.cpp inside crates/stt; ffmpeg generates the test
      # fixtures. cmake is on the image; ffmpeg is not, and comes from a
      # Homebrew bottle in a few seconds.
      - name: Install cmake and ffmpeg if missing
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ffmpeg >/dev/null || brew install ffmpeg

      # The sidecar binary depends only on main.swift, the recipe that builds
      # it, and the swiftc and SDK it was built with. The last two come with
      # the runner image, so its name and version stand in for them (asking
      # swiftc for its version costs seconds). A changed main.swift is always
      # compiled again. rust-cache throws away anything in target/ that is not
      # a dependency, so this needs its own cache.
      - name: Sidecar cache key
        id: sidecar-key
        run: echo "key=meet-stt-$ImageOS-$ImageVersion-${{ hashFiles('sidecar/**', 'justfile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the sidecar
        id: sidecar-cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.sidecar-key.outputs.key }}
          path: |
            target/meet-stt
            target/meet-stt-aarch64-apple-darwin

      - name: just sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: just sidecar

      - name: Save the sidecar
        if: github.ref == 'refs/heads/main' && steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.sidecar-key.outputs.key }}
          path: |
            target/meet-stt
            target/meet-stt-aarch64-apple-darwin

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The bindings check below relies on `cargo test` writing this file.
      # Deleting it first means that if the export test ever stops running,
      # the diff shows a deleted file and fails, rather than passing on the
      # committed copy.
      - name: Remove src/ipc/bindings.ts for cargo test to write again
        run: rm src/ipc/bindings.ts

      - name: cargo test
        run: cargo test --workspace

      # `just bindings` is `just sidecar` plus `cargo test -p meet-ai --lib
      # export_bindings`, and `cargo test --workspace` above already ran that
      # test (look for `bindings::tests::export_bindings ... ok` in its log),
      # which wrote src/ipc/bindings.ts again. So all that is left is the diff.
      # Running the test again cost about 20 s, because cargo rebuilt meet-ai
      # for it.
      - name: Generated bindings are up to date
        run: git diff --exit-code src/ipc/bindings.ts

      # Repo rules (plan Phase 8), run on the files this PR changed. Here and
      # not on ubuntu: rule R7 regenerates the bindings with cargo, which needs
      # this job's macOS build (and finds it warm).
      - name: Quality rules on changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=()
          while IFS= read -r file; do
            changed+=("$file")
          done < <(git diff --name-only --diff-filter=ACMRD "origin/$BASE_REF...HEAD")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files."
            exit 0
          fi
          scripts/quality-rules.sh "${changed[@]}"

  # Rust checks that do not need macOS. rustfmt only reads source, and
  # `just check-windows` is `cargo check` for x86_64-pc-windows-msvc: it never
  # links, and the crates it covers compile no C for the target, so neither
  # MSVC nor a Mac is needed.
  rust-portable:
    name: rust fmt + windows seam (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-seam
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The guard against this file drifting from the justfile: every command
      # in the `check` recipe needs a `run:` line here, and every recipe
      # `check` depends on needs a `run: just <recipe>` line. A command that
      # only sits in a comment does not count.
      - name: Every just check command runs here
        run: |
          set -euo pipefail
          wf=.github/workflows/check.yml
          runs="$(grep -v '^[[:space:]]*#' "$wf" | sed -n 's/^[[:space:]]*\(- \)\{0,1\}run: //p')"
          missing=0
          for dep in $(just --show check | sed -n 's/^check:\(.*\)$/\1/p'); do
            want="just $dep"
            if ! grep -qxF -- "$want" <<<"$runs"; then
              echo "::error file=$wf::\`just check\` runs \`$want\`, and this workflow does not."
              missing=1
            fi
          done
          while IFS= read -r want; do
            if ! grep -qxF -- "$want" <<<"$runs"; then
              echo "::error file=$wf::\`just check\` runs \`$want\`, and this workflow does not."
              missing=1
            fi
          done < <(just --show check | sed -n 's/^    //p')
          if [ "$missing" -eq 0 ]; then
            echo "Every command of \`just check\` runs in this workflow."
          fi
          exit "$missing"

      - name: cargo fmt
        run: cargo fmt --all --check

      # `just check` builds the sidecar too, but this check does not need it:
      # none of the six crates has a build script that looks for it.
      - name: Windows seam check
        run: just check-windows

      # The repo rules' own tests (sample files in a throwaway git repo). Needs
      # only bash, git and awk, so it runs here and not on the Mac.
      - name: Quality rules self-test
        run: scripts/quality-rules-selftest.sh

      # R10 over every tracked .rs file and every line, not only the lines a
      # branch added: two branches that each pass on their own can still add
      # up to an OS cfg in shared code once both merge (TUR-89). Same allowed
      # paths as the gate; the known-debt lines (R10_DEBT) print a warning.
      - name: R10 over the whole tree
        run: scripts/quality-rules.sh --r10-tree

  # Frontend checks. Nothing here touches Rust or macOS APIs; the bindings file
  # they compile against is the committed one, and the `rust` job proves it
  # matches the Rust side.
  js:
    name: js (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # No version input: pnpm/action-setup reads `packageManager` from
      # package.json.
      - uses: pnpm/action-setup@v4

      # package.json `engines` asks for Node >= 20.19. 24 is the current LTS.
      # setup-node keys the pnpm store cache on pnpm-lock.yaml, so a run only
      # writes a new entry when the lockfile changed.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: biome
        run: pnpm biome check .

      - name: typecheck
        run: pnpm typecheck

      - name: vitest
        run: pnpm vitest run

      - name: pnpm build
        run: pnpm build

  # The whole workspace, natively, on Windows and Linux (TUR-36, SPEC A13):
  # `src-tauri`, `store` and `modelfetch` included, which the cross-check in
  # `rust-portable` cannot cover because they compile C (sqlite, ring). Then
  # `pnpm tauri build` makes the installer, uploaded as a workflow artifact so
  # the app can be opened on that OS by hand. Both ship as preview.
  #
  # What differs from macOS:
  # - No sidecar. `just sidecar` is a no-op off macOS, and
  #   src-tauri/tauri.windows.conf.json and tauri.linux.conf.json (which Tauri
  #   merges over tauri.conf.json) drop `externalBin`, the macOS window
  #   effects, and set the bundle targets and icons.
  # - Audio is the TUR-42 platform stubs: cpal microphone, no system track.
  #   Tests that need a device are #[ignore]d the same as on macOS; macOS-only
  #   test files gate themselves with `#![cfg(target_os = "macos")]`.
  # - Whisper is built for the CPU (TUR-52): cmake and a C++ compiler build
  #   whisper.cpp, and bindgen needs libclang. GGML_NATIVE is forced OFF so
  #   the binary (and the installer artifact) runs on CPUs older than the
  #   runner's; the step "whisper.cpp was built portably" proves it was.
  # - Plus ggml's Vulkan backend (TUR-61), which needs the Vulkan SDK
  #   (headers, glslc, the loader to link). The runners have no GPU, so the
  #   tests run whisper on the CPU, the fallback a machine without a Vulkan
  #   driver gets.
  #
  # Windows runs `just check-windows`, which on Windows is exactly the native
  # build, test and clippy below (see the justfile), so the recipe and this job
  # cannot drift. Linux runs the same commands as separate steps.
  rust-native:
    name: rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundle: nsis
            # The target folder, from the workspace. Windows: D:\t, see the
            # step "Short target folder (Windows)".
            target: ../../../t
          - name: linux
            os: ubuntu-24.04
            bundle: deb
            target: target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # As in the macOS job: line numbers only, smaller and faster test builds.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        # Git Bash on Windows, so one script works on both runners.
        shell: bash
    steps:
      # Deep paths under target/ (build scripts, cmake later for whisper) pass
      # Windows' 260-character MAX_PATH; git needs telling separately.
      # Adapted from github.com/cjpais/Handy/.github/workflows/build.yml @ ffbc9504cbf004ce4819d2ca872fcea92be0fddf (MIT)
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version and components. The host target
      # (x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu) always comes with
      # the toolchain, so the file's `targets` list does not need to name them.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      # Tauri's Linux prerequisites (webkit2gtk 4.1, appindicator, rsvg) plus
      # ALSA and PulseAudio headers for cpal. apt retries each download, so a
      # flaky mirror does not fail every PR.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev patchelf

      # MSVC compiles the C deps (sqlite, ring) through the `cc` crate, which
      # finds Visual Studio on its own. clang (LLVM) is on the image too and is
      # what bindgen-based deps need; print both so a missing one shows here
      # rather than as a build-script error.
      - name: Check the Windows C toolchain
        if: runner.os == 'Windows'
        run: |
          clang --version
          cmake --version

      # whisper-rs-sys runs bindgen, which loads libclang; on Windows that is
      # the LLVM the image ships, which bindgen does not find on its own. cmake
      # and MSVC are already on the image (step above).
      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> "$GITHUB_ENV"

      # ggml-vulkan (TUR-61): headers, glslc for its shaders, and vulkan-1.lib.
      # whisper-rs-sys reads VULKAN_SDK, which the action sets.
      # Adapted from github.com/cjpais/Handy/.github/workflows/build.yml @ 73ab851c2b6242283759a4c101b60f0ece132f08 (MIT)
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # meet-ai.exe and the test binaries link vulkan-1.dll. The SDK the
      # action installs has none, so take the x64 loader from LunarG's Vulkan
      # Runtime components for the same release, pinned by SHA-256. It goes
      # into src-tauri/vulkan/, which tauri.windows.conf.json bundles beside
      # meet-ai.exe so the app starts on a PC with no GPU driver (tauri-build
      # needs it there before any build), and on PATH for the tests when
      # System32 has none.
      - name: Vulkan loader for the app and the tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_RT_URL: https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanRT-1.4.309.0-Components.zip
          VULKAN_RT_SHA256: 7d969f4d7b44e387667d3148f61559497c22d50cbe3d50adc9e5409afbce2df1
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'vulkan-rt.zip'
          Invoke-WebRequest -Uri $env:VULKAN_RT_URL -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 5
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VULKAN_RT_SHA256) {
            Write-Error "Vulkan Runtime zip has SHA-256 $hash, expected $env:VULKAN_RT_SHA256"
            exit 1
          }
          $out = Join-Path $env:RUNNER_TEMP 'vulkan-rt'
          Expand-Archive $zip -DestinationPath $out -Force
          New-Item -ItemType Directory -Force src-tauri/vulkan | Out-Null
          Copy-Item (Join-Path $out 'VulkanRT-1.4.309.0-Components/x64/vulkan-1.dll') src-tauri/vulkan/
          Get-Item src-tauri/vulkan/vulkan-1.dll | Format-List FullName, Length
          if (-not (Test-Path (Join-Path $env:SystemRoot 'System32/vulkan-1.dll'))) {
            (Resolve-Path src-tauri/vulkan).Path | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      # cmake and a C++ compiler build whisper.cpp; libclang is for bindgen.
      # build-essential (g++) comes with the Tauri packages above.
      - name: Install whisper.cpp build tools (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get -o Acquire::Retries=5 install -y cmake clang libclang-dev

      # ggml-vulkan (TUR-61): LunarG's SDK for the headers, glslc and the
      # loader, and Mesa's drivers. The runner has no GPU, and ggml skips
      # Mesa's software device, so the tests still run whisper on the CPU.
      # Adapted from github.com/cjpais/Handy/.github/workflows/build.yml @ 73ab851c2b6242283759a4c101b60f0ece132f08 (MIT)
      - name: Install the Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y vulkan-sdk mesa-vulkan-drivers

      # whisper-rs-sys passes every CMAKE_* variable to cmake, so this include
      # runs inside whisper.cpp's project() and forces GGML_NATIVE OFF: no
      # -march=native, so no illegal-instruction crash on a user's older CPU.
      # Forward slashes (`pwd -W` in Git Bash) so cmake reads the Windows path.
      - name: Build whisper.cpp portably (GGML_NATIVE=OFF)
        run: |
          root="$(pwd -W 2>/dev/null || pwd)"
          echo "CMAKE_PROJECT_INCLUDE=$root/crates/stt/cmake/force-portable-ggml.cmake" >> "$GITHUB_ENV"

      # ggml-vulkan's shader generator is a cmake sub-build nested deep in
      # whisper-rs-sys's OUT_DIR; under D:\a\meet-ai-app\meet-ai-app\target its
      # MSBuild logs pass MAX_PATH (264 characters, run 37213471056), which
      # long paths do not fix for MSBuild's file tracker. Cargo builds into a
      # folder at the drive root instead, the same one matrix.target names
      # for rust-cache (TUR-61).
      - name: Short target folder (Windows)
        if: runner.os == 'Windows'
        run: |
          dir="$(cygpath -u "$GITHUB_WORKSPACE")/$TARGET"
          mkdir -p "$dir"
          dir="$(cygpath -m "$(realpath "$dir")")"
          echo "Target folder: $dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      # Dependencies only; per-OS key so the three OSes never share entries.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}-native
          workspaces: . -> ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Windows build, test and clippy
        if: runner.os == 'Windows'
        run: just check-windows

      - name: cargo build
        if: runner.os == 'Linux'
        run: cargo build --workspace --all-targets

      # --no-fail-fast: one run lists every failing test binary, not the first.
      - name: cargo test
        if: runner.os == 'Linux'
        run: cargo test --workspace --no-fail-fast

      # The no-device audio sources CI is meant to test with (SPEC §8.2).
      - name: cargo test audio (stub-audio)
        if: runner.os == 'Linux'
        run: cargo test -p audio --features audio/stub-audio

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fails if any whisper.cpp build in target/ has GGML_NATIVE on or was
      # built without Vulkan (TUR-61), or if none was found (the include above
      # was never applied, or moved).
      - name: whisper.cpp was built portably
        run: |
          shopt -s nullglob
          target="$(cygpath -u "${CARGO_TARGET_DIR:-target}" 2>/dev/null || echo target)"
          caches=("$target"/debug/build/whisper-rs-sys-*/out/build/CMakeCache.txt)
          if [ "${#caches[@]}" -eq 0 ]; then
            echo "::error::no whisper.cpp CMakeCache.txt under $target/debug/build"
            exit 1
          fi
          for cache in "${caches[@]}"; do
            grep -H '^GGML_NATIVE:' "$cache"
            grep -q '^GGML_NATIVE:BOOL=OFF$' "$cache" || {
              echo "::error file=$cache::GGML_NATIVE is not OFF"
              exit 1
            }
          done
          # Vulkan: at least one build linked ggml-vulkan (a cache restored
          # from main may hold an older CPU-only build next to it).
          vulkan=0
          for output in "$target"/debug/build/whisper-rs-sys-*/output; do
            dir="$(dirname "$output")"
            echo "$dir: $(grep -h '^GGML_VULKAN:' "$dir/out/build/CMakeCache.txt" 2>/dev/null || echo 'no CMakeCache'), $(grep -c 'ggml-vulkan' "$output" || true) ggml-vulkan link line(s)"
            if grep -q 'rustc-link-lib=static=ggml-vulkan' "$output"; then vulkan=1; fi
          done
          if [ "$vulkan" -eq 0 ]; then
            echo "::error::no whisper.cpp build under $target/debug/build linked ggml-vulkan"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # A release build of the app and its installer: NSIS on Windows, .deb
      # on Linux (AppImage is TUR-39). Unsigned. On Windows the Tauri CLI
      # downloads the NSIS tools from GitHub, so a failed attempt is retried;
      # the second try reuses the compiled crates and costs only the bundling.
      # The Windows release build alone took 18 of the job's 30 minutes on a PR
      # (run 37148432624), past the 25-minute budget, so Windows bundles only on
      # a push to main; Linux (17 minutes in all) bundles on every PR too.
      - name: pnpm tauri build
        if: runner.os != 'Windows' || github.event_name == 'push'
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          args=(--bundles "$BUNDLE")
          if [ "$RUNNER_OS" = Linux ]; then args+=(--no-sign); fi
          for attempt in 1 2 3; do
            if pnpm tauri build "${args[@]}"; then exit 0; fi
            echo "::warning::pnpm tauri build failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: Upload the ${{ matrix.bundle }} bundle
        if: runner.os != 'Windows' || github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: meet-ai-${{ matrix.name }}-${{ matrix.bundle }}
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/release/bundle/${{ matrix.bundle }}/
          if-no-files-found: error
          retention-days: 7

  # The one status for branch protection and for release.yml. The ruleset on
  # main requires a status named `check`, so this job keeps that name. It fails
  # when any job above failed, was cancelled or was skipped, so `check` can
  # only go green when every job did. A failed job also fails the workflow
  # run itself, which is what release.yml's `workflow_run` trigger reads.
  check-result:
    name: check
    if: always()
    needs: [rust, rust-portable, js, rust-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not every job passed: $bad"
            exit 1
          fi
