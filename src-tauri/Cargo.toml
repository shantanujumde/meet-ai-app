[package]
name = "meet-ai"
description = "Botless meeting recorder for macOS."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lib]
# Tauri 2 builds the app as a library so the mobile targets can link it. The
# desktop binary below is a thin wrapper around `meet_ai_lib::run()`.
name = "meet_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
anyhow.workspace = true
# The recording state machine stamps meeting folder names from local time
# (SPEC §3.1), and the onboarding flag records when it was completed.
chrono.workspace = true
# `~/Meetings` is built with dirs + PathBuf::join and no literal `~`, per the
# Windows seam in SPEC §8.2.
dirs.workspace = true
# `config.jsonc` allows `//` comments (SPEC §3.5), which `serde_json` alone
# rejects. The "serde" feature turns on `parse_to_serde_value`, so `config.rs`
# can deserialize straight into `Transcription` instead of hand-walking a
# `JsonValue` tree.
jsonc-parser = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# `tray-icon` is the menu-bar item. `image-png` is what turns the bundled
# template PNG into a `tauri::image::Image` at startup — without it, `Image`
# only accepts raw RGBA and the tray would need the bitmap decoded by hand.
# `macos-private-api` is not optional either: tauri-build refuses to compile
# unless this list matches `app.macOSPrivateApi` in tauri.conf.json, which the
# window's `transparent` + `underWindowBackground` vibrancy turns on.
tauri = { workspace = true, features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "process",
  "sync",
  "time",
] }
# `log`: nothing installs a tracing subscriber in the app, so without this every
# `tracing::warn!` — "record shortcut refused", a failed permission check — is
# dropped, and meet-ai.log only ever shows the webview's lines. With it, events
# fall through to `log`, which tauri-plugin-log already writes to that file.
tracing = { workspace = true, features = ["log"] }
tracing-appender.workspace = true
tracing-subscriber.workspace = true

# Workspace crates. `stt` and `modelfetch` are live (the settings and model
# download screens); the rest is wiring Rune and Vox land into.
audio.workspace = true
calendar.workspace = true
detect.workspace = true
# The meeting folder layout (`audio/`, `segments.json`, `.app/`): named once
# there, for this crate and `audio`/`stt`/`store` alike.
meeting-format = { workspace = true, features = ["specta"] }
# The model download screen calls `modelfetch::ensure` directly. This is the
# only place in the app that can reach the network, which is what keeps the
# offline claim (L9–L11) structural rather than merely intended — `stt` has no
# HTTP stack in its dependency graph at all.
#
# Note for `just check-windows`: that guard names crates explicitly
# (`-p audio -p calendar -p stt -p prompts -p detect`) and src-tauri is not one
# of them, so pulling in modelfetch's rustls/ring chain here does not widen the
# exemption the justfile documents.
modelfetch.workspace = true
prompts.workspace = true
store = { workspace = true, features = ["specta"] }
stt = { workspace = true, features = ["specta"] }

# Desktop-only plugins. A global shortcut, a single-instance guard and an
# updater have no meaning on mobile, and Tauri's own template gates them the
# same way.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
