[package]
name = "agent"
description = "Runs the user's own agent CLI (Claude Code, Codex) as a local child process and checks its JSON (SPEC A11)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# Home folder and Windows AppData folders for finding the CLIs (TUR-53).
dirs.workspace = true
# Output check against the run's JSON schema (SPEC A11). Same validator as
# crates/prompts, from the one shared pin in the workspace Cargo.toml (no
# default features, so no network client), so the two cannot drift apart.
jsonschema.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Every run gets a fresh, empty working folder (SPEC A11), deleted afterwards.
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
# PATH lookup that respects PATHEXT, so `claude` finds `claude.cmd` (TUR-53).
which.workspace = true
# The whole process tree on Cancel and the time limit (TUR-54): a process
# group on unix, a Job Object on Windows.
process-wrap.workspace = true
# The fake harness runs the `fake-cli` program from here (feature
# `test-support` only).
test-support = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own tests use the fake harness.
agent = { path = ".", features = ["test-support"] }

[features]
# `FakeHarness`, for tests in this crate and in the app. Never on in a build.
test-support = ["dep:test-support"]

# No console window flashes up for a CLI started on Windows, and its
# kill-on-close Job Object (TUR-54, platform/windows_job.rs).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
