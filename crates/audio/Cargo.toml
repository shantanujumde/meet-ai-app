[package]
name = "audio"
description = "System audio tap + mic capture, resampling, incremental WAV writing."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "meet-rec"
path = "src/bin/meet-rec.rs"

[[bin]]
name = "drift-check"
path = "src/bin/drift-check.rs"

# Core Audio only, so it lives in an OS folder (rule R10) and Cargo needs its
# path; on Windows and Linux it builds as a stub that says so (TUR-36).
[[example]]
name = "switch_output"
path = "examples/macos/switch_output.rs"

[dependencies]
cpal.workspace = true
hound.workspace = true
# The `segments.json` schema, `Channel`, the sample rate, the folder layout and
# the atomic write — shared with `stt` and `store` so the writer here and the
# readers there cannot define the file twice.
meeting-format.workspace = true
ringbuf.workspace = true
rubato.workspace = true
realfft.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Apple frameworks. SPEC §4: OS-specific code lives ONLY in src/macos/, and the
# AudioSource trait in src/lib.rs stays platform-agnostic so the Windows port is
# additive. Gating here is what keeps `just check-windows` honest.
#
# ⚠️ `objc2` 0.6.4 alongside `objc2-*` 0.3.2 is CORRECT (SETUP.md §2.2).
#    Framework crates version independently. Never "align" these.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = [
    "AVCaptureDevice",
    "AVMediaFormat",
] }
objc2-core-audio.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true

# The microphone consent registry keys (TUR-51, src/platform/windows_permission.rs).
[target.'cfg(target_os = "windows")'.dependencies]
winreg.workspace = true
# "Mic in use by another app" (TUR-60): WASAPI sessions, with `sysinfo` for the
# names in the debug log, and the PulseAudio/PipeWire stream lists.
sysinfo.workspace = true
wasapi.workspace = true
# QueryPerformanceCounter, the host clock on Windows (TUR-37, src/platform/windows_devices.rs).
# TUR-65 adds the endpoint form factor and topology reads (src/platform/windows/headphones.rs).
windows = { workspace = true, features = ["Win32_System_Performance", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding.workspace = true
# TUR-38: cpal's PipeWire host first, then PulseAudio, then ALSA (cpal's own
# `default_host` order). PipeWire records the default sink (system audio);
# ALSA cannot reach a monitor at all. Links libpipewire-0.3 and libpulse
# (`libpipewire-0.3-dev`, `libpulse-dev`). Never bundle libpipewire or libspa
# in an AppImage: they load plugins from a build-time path and capture
# silence on other distros.
cpal = { workspace = true, features = ["pipewire", "pulseaudio"] }
libc.workspace = true

[dev-dependencies]
# Test-only: temp folders and the shared tone generator.
tempfile.workspace = true
test-support.workspace = true

[features]
# No-op system and mic sources, and `Unmeasurable` permission checks, on any OS
# (SPEC §8.2), so CI can build and test without audio devices. Off by default;
# never on in the app build. See src/platform/stub.rs.
stub-audio = []
