[package]
name = "meeting-format"
description = "The on-disk facts every crate shares: folder layout, segments.json, transcript lines, channels, the atomic write."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "meeting_format"

# serde and nothing else, on purpose. `audio`, `stt` and `store` all depend on
# this crate, so anything added here lands in all three — and `stt` and `store`
# must stay free of mac-only code (SPEC §8.2). No `#[cfg(target_os)]` deps, no
# JSON parser (each reader brings its own), no logging.
[dependencies]
# Optional: only the app shell turns it on, to generate TypeScript bindings.
specta = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# Test-only: the schema tests parse real `segments.json` shapes.
serde_json.workspace = true

[features]
specta = ["dep:specta"]
