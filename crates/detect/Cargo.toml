[package]
name = "detect"
description = "Meeting detection from running processes and audio activity."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Not optional, unlike `stt`'s: `Signal` rides on the `detection://prompt`
# event, so the app always needs its TypeScript shape, and making it a feature
# would mean editing the app's existing `detect` dependency line.
specta.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# `processes::name_of`, this OS's process name for a label, for the app's
# tests. Off in the app build.
test-util = []
