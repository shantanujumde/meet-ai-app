[package]
name = "test-support"
description = "Dev-only helpers shared by the crates' tests (tone generators)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
# `process_is_gone`: one way to check a pid on every OS (TUR-54).
sysinfo.workspace = true

# The pretend agent CLI the agent tests run on every OS (TUR-54). `build.rs`
# also compiles it into OUT_DIR, which is the copy the tests use; see there.
[[bin]]
name = "fake-cli"
path = "src/bin/fake_cli.rs"
test = false
