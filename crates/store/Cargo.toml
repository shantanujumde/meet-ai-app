[package]
name = "store"
description = "Markdown read/write, YAML frontmatter, file watching, derived SQLite FTS5 index."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# Optional: only the app shell turns it on, to generate TypeScript bindings.
specta = { workspace = true, optional = true }
# `retention` dates a meeting from its `meeting.md` date or folder name.
chrono.workspace = true
dirs.workspace = true
# The §3.1 file names, `Speaker`, the transcript line and the atomic write,
# shared with `stt` (the transcript's writer) without depending on it.
meeting-format.workspace = true
notify.workspace = true
# The checked notes JSON (SPEC A11) that `agent_notes` writes out.
prompts.workspace = true
# `agent_notes` fingerprints each ticket it writes, to tell later whether the
# user touched it.
sha2.workspace = true
notify-debouncer-full.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
yaml-rust2.workspace = true

# SETUP.md §2.4 asks for features ["bundled", "fts5"]. rusqlite 0.40.2 has no
# `fts5` feature — `bundled` compiles the amalgamation with SQLITE_ENABLE_FTS5
# already on. Asking for it fails to resolve. The `fts5_is_available` test in
# src/lib.rs proves FTS5 really is there rather than trusting this comment.
#
# `bundled` also compiles sqlite3.c for the *target*, which is why this crate is
# outside `just check-windows`. See the note in the justfile.
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
# Test-only cross-check that `transcript` reads exactly what stt's MarkdownSink
# writes (SPEC §3.4: the sink is the file's only writer, this crate its reader).
# Dev-only, so store's normal dependency graph stays light.
stt.workspace = true

[features]
specta = ["dep:specta"]
