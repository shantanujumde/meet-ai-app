[workspace]
members = ["crates/*", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
version = "0.3.0"

# Every version here is pinned exactly to SETUP.md §2. Do not bump one without
# updating SETUP.md in the same commit — two other crates depend on these being
# the versions their docs were read against (see CLAUDE.md, the "new major" rule).
[workspace.dependencies]
# --- local crates ---
agent = { path = "crates/agent" }
audio = { path = "crates/audio" }
calendar = { path = "crates/calendar" }
detect = { path = "crates/detect" }
meeting-format = { path = "crates/meeting-format" }
modelfetch = { path = "crates/modelfetch" }
prompts = { path = "crates/prompts" }
store = { path = "crates/store" }
stt = { path = "crates/stt" }
test-support = { path = "crates/test-support" }

# --- audio (SETUP.md §2.2) ---
block2 = "=0.6.2"
cpal = "=0.18.2"
earshot = "=1.2.2"
hound = "=3.5.1"
objc2 = "=0.6.4"
objc2-av-foundation = { version = "=0.3.2", default-features = false }
objc2-core-audio = "=0.3.2"
objc2-core-audio-types = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-foundation = "=0.3.2"
ringbuf = "=0.5.1"
rubato = "=5.0.0"

# --- calendar (SETUP.md §2.5) ---
# Tier 1, zero-auth (TUR-26). Same 0.3.2 line as the other objc2-* framework
# crates. No default features: those pull AppKit, MapKit and CoreLocation.
objc2-event-kit = { version = "=0.3.2", default-features = false }
# Google + Microsoft sign-in (TUR-44, SPEC A12). `oauth2` without default
# features: those pull reqwest, and `crates/calendar` must keep no network
# client of its own, so `cargo check --target x86_64-pc-windows-msvc -p
# calendar` stays free of ring's C build. The app turns on `reqwest-blocking`
# in src-tauri, where the HTTP client lives.
oauth2 = { version = "=5.0.0", default-features = false }
# v4: a thin wrapper over the per-OS stores (Keychain, Windows Credential
# Manager, Secret Service through zbus). Default feature `v1` is the simple
# `Entry` API. LLMs know v2/v3; read docs.rs for 4.2 first.
keyring = "=4.2.0"
# The account label is read from the id_token's payload (base64url JSON).
# Same version oauth2 itself already pulls.
base64 = "=0.22.1"
# Microsoft Graph calendar (TUR-47): a Windows zone name, once mapped to IANA
# (crates/calendar/src/windows_tz.rs), becomes a real offset. Pure Rust, the
# tz database compiled in; no C build.
chrono-tz = "=0.10.4"
# Join-link check (TUR-86, crates/calendar/src/join_url.rs): the WHATWG URL
# parser browsers use, so the allow-list sees the host a browser would open.
# Same version oauth2 already pulls.
url = "=2.5.8"

# --- speech-to-text (SETUP.md §2.3) ---
whisper-rs = "=0.16.0"

# --- model download (SETUP.md §2.5) ---
# Listed under "Calendar & auth" in SETUP.md because Phase 5 was the first
# planned consumer, but the pinned versions are the ones Phase 1's lazy model
# downloader needs first. Same versions, added earlier than SETUP.md expected.
reqwest = { version = "=0.12.28", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
sha2 = "=0.10.9"
tokio-util = "=0.7.19"

# --- store, config, prompts (SETUP.md §2.4) ---
chrono = { version = "=0.4.45", features = ["serde"] }
dirs = "=6.0.0"
jsonc-parser = "=0.33.1"
# Notes-schema check (SPEC A11). No default features: they pull reqwest for
# remote $refs, and nothing in crates/prompts may grow a network client.
jsonschema = { version = "=0.58.4", default-features = false }
minijinja = "=2.24.0"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
rusqlite = "=0.40.2"
serde = "=1.0.229"
serde_json = "=1.0.151"
yaml-rust2 = "=0.12.0"

# --- runtime, logging, errors, testing (SETUP.md §2.6) ---
anyhow = "=1.0.104"
insta = "=1.48.0"
sysinfo = "=0.39.6"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
# Native crash handler: writes a local crash file, nothing is sent (TUR-46).
crash-handler = "=0.7.0"

# --- tauri (SETUP.md §2.1) ---
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-log = "=2.9.1"
tauri-plugin-notification = "=2.4.0"
# The loopback listener for calendar sign-in (TUR-44). Only its Rust API is
# used; the JS plugin is never registered.
tauri-plugin-oauth = "=2.1.0"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-updater = "=2.11.0"

# --- generated TypeScript bindings (Phase 2) ---
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[profile.release]
# Audio work is realtime-sensitive; do not let a debug-ish release profile in.
lto = true
codegen-units = 1
