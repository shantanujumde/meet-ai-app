[workspace]
members = ["crates/*", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
version = "0.4.0"

# Every version here is pinned exactly to SETUP.md §2. Do not bump one without
# updating SETUP.md in the same commit — two other crates depend on these being
# the versions their docs were read against (see CLAUDE.md, the "new major" rule).
[workspace.dependencies]
# --- local crates ---
agent = { path = "crates/agent" }
audio = { path = "crates/audio" }
calendar = { path = "crates/calendar" }
detect = { path = "crates/detect" }
meeting-format = { path = "crates/meeting-format" }
modelfetch = { path = "crates/modelfetch" }
prompts = { path = "crates/prompts" }
store = { path = "crates/store" }
stt = { path = "crates/stt" }
test-support = { path = "crates/test-support" }

# --- audio (SETUP.md §2.2) ---
block2 = "=0.6.2"
cpal = "=0.18.2"
earshot = "=1.2.2"
hound = "=3.5.1"
objc2 = "=0.6.4"
objc2-av-foundation = { version = "=0.3.2", default-features = false }
objc2-core-audio = "=0.3.2"
objc2-core-audio-types = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-foundation = "=0.3.2"
ringbuf = "=0.5.1"
rubato = "=5.0.0"
# Real FFTs for drift-check --audio (GCC-PHAT, TUR-64). Already in the tree
# through rubato, so this pins the same version.
realfft = "=3.5.0"
# "Mic in use by another app" off macOS (TUR-60). wasapi: safe wrappers over
# WASAPI's session list, pure Rust over the `windows` crate (MIT). libpulse:
# the PulseAudio client API, which PipeWire answers too through
# pipewire-pulse; links libpulse.so (libpulse-dev, already in CI's apt list).
wasapi = "=0.25.0"
libpulse-binding = "=2.30.1"

# --- calendar (SETUP.md §2.5) ---
# Tier 1, zero-auth (TUR-26). Same 0.3.2 line as the other objc2-* framework
# crates. No default features: those pull AppKit, MapKit and CoreLocation.
objc2-event-kit = { version = "=0.3.2", default-features = false }
# Google + Microsoft sign-in (TUR-44, SPEC A12). `oauth2` without default
# features: those pull reqwest, and `crates/calendar` must keep no network
# client of its own, so `cargo check --target x86_64-pc-windows-msvc -p
# calendar` stays free of ring's C build. The app turns on `reqwest-blocking`
# in src-tauri, where the HTTP client lives.
oauth2 = { version = "=5.0.0", default-features = false }
# v4: a thin wrapper over the per-OS stores (Keychain, Windows Credential
# Manager, Secret Service through zbus). Default feature `v1` is the simple
# `Entry` API. LLMs know v2/v3; read docs.rs for 4.2 first.
keyring = "=4.2.0"
# The account label is read from the id_token's payload (base64url JSON).
# Same version oauth2 itself already pulls.
base64 = "=0.22.1"
# Microsoft Graph calendar (TUR-47): a Windows zone name, once mapped to IANA
# (crates/calendar/src/windows_tz.rs), becomes a real offset. Pure Rust, the
# tz database compiled in; no C build.
chrono-tz = "=0.10.4"
# Join-link check (TUR-86, crates/calendar/src/join_url.rs): the WHATWG URL
# parser browsers use, so the allow-list sees the host a browser would open.
# Same version oauth2 already pulls.
url = "=2.5.8"

# --- speech-to-text (SETUP.md §2.3) ---
whisper-rs = "=0.16.0"
# Parakeet (TUR-62): NVIDIA parakeet-tdt-0.6b-v3 over ONNX Runtime, on the CPU
# only (no DirectML, no CUDA, no CoreML). MIT OR Apache-2.0. No default
# features: they turn on `ort/default`, whose TLS and linking choices are made
# per OS in crates/stt/Cargo.toml instead. `api-28` is the API level
# parakeet-rs 0.3.8 ships with, matching ONNX Runtime 1.28.
parakeet-rs = { version = "=0.3.8", default-features = false, features = [
  "cpu",
  "api-28",
] }
# The ONNX Runtime binding parakeet-rs 0.3.8 pins. MIT OR Apache-2.0.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
  "std",
  "tracing",
] }

# --- model download (SETUP.md §2.5) ---
# Listed under "Calendar & auth" in SETUP.md because Phase 5 was the first
# planned consumer, but the pinned versions are the ones Phase 1's lazy model
# downloader needs first. Same versions, added earlier than SETUP.md expected.
reqwest = { version = "=0.12.28", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
sha2 = "=0.10.9"
tokio-util = "=0.7.19"

# --- store, config, prompts (SETUP.md §2.4) ---
chrono = { version = "=0.4.45", features = ["serde"] }
dirs = "=6.0.0"
# Finding agent CLIs on PATH, PATHEXT-aware on Windows (TUR-53).
which = "=8.0.6"
jsonc-parser = "=0.33.1"
# Notes-schema check (SPEC A11). No default features: they pull reqwest for
# remote $refs, and nothing in crates/prompts may grow a network client.
jsonschema = { version = "=0.58.4", default-features = false }
minijinja = "=2.24.0"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
# Canonical paths without Windows' `\\?\` prefix, so `SelfWrites` matches
# notify's event paths (TUR-55). A plain `std::fs::canonicalize` elsewhere.
dunce = "=1.0.5"
rusqlite = "=0.40.2"
serde = "=1.0.229"
serde_json = "=1.0.151"
yaml-rust2 = "=0.12.0"
# Delete a meeting by moving its folder to the system Trash / Recycle Bin
# (TUR-116). MIT. On macOS it pulls the same objc2 0.6 / objc2-foundation 0.3
# lines as the audio crates; on Windows the same `windows` 0.62.
trash = "=5.2.9"

# --- runtime, logging, errors, testing (SETUP.md §2.6) ---
anyhow = "=1.0.104"
insta = "=1.48.0"
sysinfo = "=0.39.6"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
# Native crash handler: writes a local crash file, nothing is sent (TUR-46).
crash-handler = "=0.7.0"
# The Windows microphone consent keys (TUR-51). Already in the tree via other crates.
winreg = "=0.55.0"
# logind's PrepareForSleep signal and sleep inhibitor on Linux (TUR-145). MIT.
# Same version tauri-plugin-single-instance and notify-rust already pull.
zbus = "=5.19.0"
# Agent CLIs (TUR-54): the child and everything it starts in one process
# group (unix) or a Job Object (Windows), so Cancel stops the whole
# tree. Apache-2.0 OR MIT. Only the std wrappers; no tokio.
process-wrap = { version = "=10.0.1", default-features = false, features = [
  "creation-flags",
  "job-object",
  "process-group",
  "std",
] }
# The `CREATE_NO_WINDOW` flag type process-wrap takes on Windows (TUR-54).
# Same version process-wrap itself pulls, so no second copy.
# Also the performance counter, the clock both tracks' positions use on Windows (TUR-37).
windows = { version = "=0.62.2", default-features = false }
# clock_gettime(CLOCK_MONOTONIC), the clock both tracks' positions use on
# Linux (TUR-38). Same version cpal and others already pull.
libc = "=0.2.189"

# --- tauri (SETUP.md §2.1) ---
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-log = "=2.9.1"
tauri-plugin-notification = "=2.4.0"
# The loopback listener for calendar sign-in (TUR-44). Only its Rust API is
# used; the JS plugin is never registered.
tauri-plugin-opener = "=2.5.5"
# The OS name for per-OS wording in the window (TUR-51, `src/lib/osText.ts`).
tauri-plugin-os = "=2.3.2"
tauri-plugin-single-instance = "=2.4.4"
# "Start at login" (TUR-58): LaunchAgent, Run key, XDG autostart.
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-updater = "=2.11.0"
# The prompt card as a non-activating NSPanel on every Space (TUR-147,
# src-tauri/src/detection/popup/platform/macos.rs). Same 0.3.2 line as the
# other objc2-* crates, already in the tree through tao. Zlib OR Apache-2.0
# OR MIT. No default features: they pull every AppKit class.
objc2-app-kit = { version = "=0.3.2", default-features = false }

# --- generated TypeScript bindings (Phase 2) ---
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[profile.release]
# Audio work is realtime-sensitive; do not let a debug-ish release profile in.
lto = true
codegen-units = 1
